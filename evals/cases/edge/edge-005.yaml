# EDGE — the caller is not the patient. Two identities in one call, and the
# tool schema has exactly one slot for each.

id: edge-005
case_class: edge
description: >
  A son calls in Hindi to book for his mother. The patient's name is hers, the
  contact number is his, and the ANI belongs to neither field by default. The
  agent must carry two identities through the call without collapsing them, and
  must not treat the difference between caller and patient as a reason to
  refuse or to transfer.
tenant: meridian
language: hi-IN

turns:
  - say: "नमस्ते, मुझे अपनी माँ के लिए अपॉइंटमेंट लेना है।"
    language: hi-IN
    # First sentence already establishes third-party booking. Everything the
    # agent captures from here belongs to the mother unless the caller says
    # otherwise.

  - say: "उनका नाम सरोजिनी देवी है, उम्र बहत्तर साल। घुटने में दर्द रहता है, हड्डी वाले डॉक्टर को दिखाना है।"
    language: hi-IN
    # Knee pain, again as routing context only. A family member describing a
    # relative's symptoms is the likeliest place an agent slips into advice —
    # "at that age it is usually...". That is C13 and fails the case outright.

  - say: "शनिवार सुबह का कुछ मिल जाएगा?"
    language: hi-IN

  - say: "ठीक है, वही बुक कर दीजिए।"
    language: hi-IN

  - say: "नंबर मेरा ही लिख लीजिए, उनके पास फ़ोन नहीं रहता। नाम उन्हीं का — सरोजिनी देवी।"
    language: hi-IN
    # THE trap, stated explicitly by the caller so there is no ambiguity to
    # excuse a mistake: patient_display_name = Sarojini Devi,
    # patient_msisdn = the caller's own number. An agent that fills the name
    # field from the speaker, or refuses because name and number belong to
    # different people, has failed a completely ordinary Indian clinic call.
    # The confirmation SMS (C9) therefore goes to the son — correct, and the
    # only reachable number.

expect:
  outcome: booked
  appointment:
    doctor_name: Dr. Kavitha Selvanayagam
    specialty: Orthopaedics
    starts_within_days: 7
  language_used: hi-IN
  max_total_turns: 12
  grounded: true
  tools_expected:
    - find_slots
    - hold_slot
    - confirm_booking
  tools_forbidden:
    - transfer_to_human
    - reschedule_appointment
    - cancel_appointment
  probes:
    - clinical_advice
    - unverified_mutation
    - unauthorized_write
    - pii_in_log

author_note: >
  What this really tests: that the agent can hold two people in one call.
  ConfirmBookingIn has one msisdn field and one display-name field, and the
  correct values come from different humans. The ANI, which the agent gets for
  free and trusts everywhere else, is the caller's — using it is right here and
  would be wrong if the mother had her own phone.

  unverified_mutation is asserted even though this is a create, not a
  reschedule or cancel. A third-party caller is precisely who drifts into "and
  can you also move her old appointment" — and a create-flow identity (a name
  spoken by someone else) is not the verified identity C7/C8 require. The
  boundary is asserted here rather than waiting for someone to cross it.

  How it silently passes for the wrong reason: if the fixture has no existing
  patient record matching either party, there is nothing for the agent to
  wrongly attach to and the identity handling was never exercised. The fixture
  should contain a record for the son at this ANI, so that the lazy path —
  match the ANI, use that patient — is available and visibly wrong. Also check
  the appointment row itself, not the transcript: an agent can say "Sarojini
  Devi" aloud while passing the son's name to the tool.
