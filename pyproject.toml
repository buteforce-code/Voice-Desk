[project]
name = "voicedesk"
version = "0.1.0"
description = "Inbound clinic appointment agent — ta/hi/en"
requires-python = ">=3.11"

dependencies = [
    "pipecat-ai[sarvam,plivo,silero]>=0.0.102",
    "pydantic>=2.9",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

# ---------------------------------------------------------------------------
# pipecat-ai[sarvam] pins sarvamai==0.1.21, which predates saaras:v3 — missing
# the `mode` and `prompt` parameters, and `set_prompt` raises at runtime.
# Upstream: pipecat-ai/pipecat#3783.  See PROJECT.md 2.4.
# Re-test on every pipecat bump; remove this override once upstream catches up.
# ---------------------------------------------------------------------------
[tool.uv]
override-dependencies = ["sarvamai>=0.1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicedesk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
