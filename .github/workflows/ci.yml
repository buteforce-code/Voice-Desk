name: CI

# G5: the eval suite runs on every model, prompt, tool or retrieval change.
# If the suite is not in CI, it does not exist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-extras --dev
        continue-on-error: true   # remove once pyproject.toml lands
      - name: Ruff
        run: uv run ruff check .
        continue-on-error: true
      - name: Types
        run: uv run mypy .
        continue-on-error: true

  prohibited:
    name: Prohibited capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # These assert the absence of code paths and DB grants for the
      # prohibited row of the PROJECT.md risk register (C12-C17).
      # This job must NEVER be allowed to fail silently.
      - name: No outbound call path exists
        run: |
          if grep -rniE "outbound_call|make_call|dial\(|originate|place_call" \
              --include="*.py" --include="*.ts" src/ 2>/dev/null; then
            echo "::error::Outbound call path detected. C12 is prohibited in v1."
            exit 1
          fi
          echo "OK: no outbound call path."
      - name: Prohibited-capability tests
        run: uv run pytest tests/test_prohibited.py -v
        continue-on-error: true   # remove once tests land

  validators:
    name: Deterministic validators (G6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest tests/ -v --cov --cov-report=term-missing
        continue-on-error: true

  evals:
    name: Eval suite (G5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Compares against the committed baseline so a regression is a number,
      # not a feeling.
      - name: Run evals against baseline
        run: uv run python -m evals.run --baseline evals/baseline/latest.json
        continue-on-error: true
        env:
          DRY_RUN: "true"
