name: CI

# G5: the eval suite runs on every model, prompt, tool or retrieval change.
# If the suite is not in CI, it does not exist.
#
# `continue-on-error` was on every step of this file while the code it guarded
# did not exist yet. That is defensible for a scaffold and indefensible once
# the tests are real: an advisory prohibited-capabilities job reports green for
# months and is discovered at the worst possible moment. The only step still
# advisory is mypy, and it says so.

on:
  push:
    # Both names on purpose. This repo's default branch is `master`, and the
    # trigger said `main` only -- so the workflow would not have run on push
    # even once a remote existed. Two independent reasons the "blocking CI job"
    # claim was fiction: no remote, and a branch filter that matched nothing.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-extras --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Types
        run: uv run mypy .
        # Advisory. `strict = true` against a codebase with no runtime wired up
        # yet produces noise that would train people to ignore this job. Flip to
        # blocking when the pipeline lands, not before.
        continue-on-error: true

  prohibited:
    name: Prohibited capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-extras --dev

      # A cheap check that holds even if Python is broken. It matches call
      # SITES only -- `outbound_call(` and not `"outbound_call"` -- because the
      # names also appear in `_PROHIBITED_BY_ABSENCE`, the frozenset that lists
      # them so they can be checked for. The previous pattern matched that
      # frozenset and failed against the guard it was guarding.
      - name: No outbound call path exists
        run: |
          if grep -rnE "(outbound_call|make_call|place_call|originate_call|start_outbound|dial)[[:space:]]*\(" \
              --include="*.py" --include="*.ts" src/ 2>/dev/null; then
            echo "::error::Outbound call path detected. C12 is prohibited in v1."
            exit 1
          fi
          echo "OK: no outbound call path."

      # These assert the absence of code paths and DB grants for the prohibited
      # row of the risk register (C12-C17). BLOCKING. Do not add
      # continue-on-error to this step -- a prohibited tier that is only
      # advisory is a comment, which PROJECT.md 2.1 explicitly rejects.
      - name: Prohibited-capability tests
        run: uv run pytest tests/test_prohibited.py -v

      - name: Tenant isolation tests
        run: uv run pytest tests/test_tenant_isolation.py -v

      # C13 is the one prohibited capability that cannot be enforced by
      # absence -- a model can simply say the words. PROJECT.md 2.1 names this
      # classifier as the control, so it belongs in the blocking job with the
      # rest of the prohibited row rather than only in the general suite.
      - name: Clinical guard (C13/C14)
        run: uv run pytest tests/test_clinical_guard.py -v

  validators:
    name: Deterministic validators (G6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-extras --dev
      - run: uv run pytest tests/ -v --cov --cov-report=term-missing

  evals:
    name: Eval suite (G5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-extras --dev

      # Blocking. Case conformance does not need the pipeline, and this is what
      # makes parallel case authoring safe.
      - name: Validate eval cases
        run: uv run python -m evals.run --validate

      # The scorer itself. A scorer that cannot fail reports a perfect suite,
      # and the number it writes is what every later change is judged against,
      # so its detectors get positive AND negative controls. No key, no model,
      # no network: a RunRecord is data.
      - name: Eval harness tests
        run: uv run pytest tests/test_eval_harness.py tests/test_eval_judge.py -v

  # The SCORED run. Deliberately not on push.
  #
  # G5 asks for the suite to run in CI on every model, prompt, tool or
  # retrieval change. Case conformance and the scorer's own tests do, above.
  # The scored run does not, and saying so is better than a job that skips
  # itself when a secret is missing and reports green -- which is the exact
  # failure this file already carries a comment about.
  #
  # It needs a provider key and it spends money on every invocation. Until a
  # key lives in repository secrets this is manual, and PROJECT.md 5b records
  # the gap rather than the intention.
  eval-baseline:
    name: Scored eval run (G5) — manual
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-extras --dev

      # Exits non-zero on a per-case regression against the committed baseline.
      # A case that newly fails is the signal; the aggregate moving is not, and
      # a suite that only watched the total would stay green while one class
      # collapsed and another improved.
      - name: Run against the committed baseline
        run: uv run python -m evals.run --against evals/baseline/latest.json
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openrouter' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "false"
